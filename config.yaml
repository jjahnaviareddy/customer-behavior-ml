# config.yaml — Centralized configuration for the ML pipeline

data:
  raw_path: "data/raw/customer_data.csv"
  processed_path: "data/processed/features.csv"
  target_column: "purchased"
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - recency_days
    - frequency
    - monetary_value
    - session_count
    - pages_per_session
    - avg_time_on_site
  categorical:
    - device_type
    - traffic_source
    - customer_segment
  engineered:
    - recency_score
    - frequency_ratio
    - avg_order_value
    - session_depth
    - weekend_activity
    - cart_abandonment_rate
    - clv_proxy

preprocessing:
  handle_imbalance: true
  imbalance_strategy: "smote"  # options: smote, oversample, undersample, class_weight
  scaling: "standard"           # options: standard, minmax, robust

models:
  logistic_regression:
    C: [0.01, 0.1, 1, 10, 100]
    solver: ["lbfgs", "liblinear"]
    max_iter: [500]

  random_forest:
    n_estimators: [100, 200, 300]
    max_depth: [4, 6, 8, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]

  xgboost:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 6, 8]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    subsample: [0.7, 0.8, 1.0]
    colsample_bytree: [0.7, 0.8, 1.0]
    reg_alpha: [0, 0.1, 0.5]

  svm:
    C: [0.1, 1, 10]
    kernel: ["rbf", "poly"]
    gamma: ["scale", "auto"]

evaluation:
  cv_folds: 5
  scoring_metric: "f1"          # primary metric
  metrics: ["f1", "roc_auc", "precision", "recall", "accuracy"]
  threshold: 0.5

output:
  model_dir: "models/"
  report_dir: "reports/figures/"
  best_model_path: "models/best_model.pkl"
